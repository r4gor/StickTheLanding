# ===========================================================================
# Submission manifest — copy to `evaluation/submission_<your_team>.yaml`
# and edit. The scorer reads it to know which Tier 1 features to test.
#
# CRITICAL HONESTY RULE
# ---------------------
# Set a tier_1 feature to `true` ONLY if your simulator actually
# implements it. The corresponding test will be RUN automatically. If it
# fails, you earn 0 for that feature AND get a "declared but not
# detected" flag in the breakdown. Don't bluff — the tests are
# physically motivated and hard to game.
#
# Tier 0 is NOT declared here — it's always tested. If any Tier 0 test
# fails, your simulator score is 0 and Tier 1 is skipped.
# ===========================================================================

team:           "stick-the-landing"

# ----- Declared simulator features (Tier 1, 5 points each, max 30) ---------
# Only declare what you actually implemented. Each `true` triggers an
# automated test; failure = 0 points + dishonesty flag.
simulator_features:
  tier_1:
    motor_lag:        true    # T1.A first-order RPM dynamics (baseline + AST diverged)
    battery_sag:      true    # T1.B OCV-R_int with ω_max ceiling
    aero_drag:        true    # T1.C body-frame linear + quadratic drag
    cross_coupling:   true    # T1.D Newton-Euler ω×(I·ω) term (baseline + AST diverged)
    substepping:      true    # T1.E internal sub-stepping (baseline + AST diverged)
    ground_effect:    true    # T1.F Cheng-Frantz κ=0.10 per-motor amplifier

# ----- Notes for the human reviewer (Tier 2 rubric, max 5 pts) -------------
# 1-2 paragraphs. The reviewer will use this together with your code to
# score:
#   T2.C code quality of the simulator (0/3/5)
notes: |
  Beyond the Tier-1 baselines the battery model uses a linear SOC-dependent
  OCV curve (V_oc = V_nom * (0.80 + 0.40 * SOC)) with a pack-level internal
  resistance of 0.20 Ω (cell + harness/ESC/BEC parasitics; spec value of
  0.025 Ω is cell-only and produces only ~2% sag at full throttle). An ESC
  efficiency factor η_esc = 0.80 scales the mechanical-to-electrical current
  estimate. The ω_max ceiling formulation — rather than multiplicative
  throttle scaling — preserves hover trim: at low throttle the battery has
  headroom and the motor tracks the request exactly; saturation only occurs
  when V_term can no longer push more current through R_int. The ground-effect
  amplifier computes each motor's world-z height by projecting motor body
  positions through the current rotation matrix, so the per-motor h is correct
  even when the drone is tilted. Quaternion integration uses the closed-form
  axis-angle formulation (exact for constant ω over the substep).

  The sim tracks SOC depletion via a running energy integral (E_rem in Wh)
  and feeds V_term back into the next substep's current estimate — the
  full electrical feedback loop is live at every 5 ms substep. Known
  limitations: the integrator is semi-implicit Euler (not RK4); rotor
  gyroscopic torque on the body and motor rotor inertia (rotor_inertia from
  the spec) are not modelled; no VTOL tilt-servo dynamics or hover/cruise
  transition logic.
